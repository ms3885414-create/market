<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>اطلب من السوبر ماركت</title>
<link rel="stylesheet" href="style.css"></head><body>
<header><h1>🛒 اطلب من السوبر ماركت</h1></header>
<main><div id="msg" class="msg">جاري التحميل…</div><div id="cats" class="cats"></div><div id="grid" class="grid"></div></main>
<div id="cart" class="cart hid">
  <div class="row" id="bar" style="cursor:pointer;font-weight:700"><span id="info"></span><span style="flex:none">⌃</span></div>
  <div id="body" class="hid"><div id="lines"></div>
    <label>الاسم</label><input id="n"><label>رقم الموبايل</label><input id="p" type="tel">
    <label>العنوان</label><input id="a"><label>ملاحظات</label><input id="t">
    <button class="btn" id="send" style="width:100%;margin-top:12px">تأكيد الطلب</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(CFG.URL,CFG.KEY),$=i=>document.getElementById(i);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>Number(n).toLocaleString('ar-EG')+' ج.م';
let products=[],cart={},cat='الكل';
async function load(){
  const {data,error}=await sb.from('products').select('*').order('name');
  if(error){$('msg').textContent='تعذر تحميل المنتجات';return}
  products=data;$('msg').classList.toggle('hid',!!data.length);if(!data.length)$('msg').textContent='لا توجد منتجات حاليًا.';render();
}
function render(){
  const cats=['الكل',...new Set(products.map(p=>p.category).filter(Boolean))];
  $('cats').innerHTML=cats.map(c=>`<button class="btn ${c===cat?'':'g'}" data-c="${E(c)}">${E(c)}</button>`).join('');
  $('cats').querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;render()});
  $('grid').innerHTML=products.filter(p=>cat==='الكل'||p.category===cat).map(p=>`<div class="card"><div class="em">${E(p.emoji||'📦')}</div><b>${E(p.name)}</b><div class="pr">${money(p.price)}</div><small>${p.stock>0?'متاح':'غير متاح'}</small><button class="btn" style="width:100%;margin-top:8px" data-id="${p.id}" ${p.stock>0?'':'disabled'}>أضف للسلة</button></div>`).join('');
  $('grid').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>add(b.dataset.id,1));cartUI();
}
function add(id,d){const p=products.find(x=>x.id===id);const n=(cart[id]||0)+d;if(n<=0)delete cart[id];else cart[id]=Math.min(n,p.stock);cartUI()}
function cartUI(){
  const ids=Object.keys(cart).filter(id=>products.some(p=>p.id===id));let tot=0,cnt=0;
  $('lines').innerHTML=ids.map(id=>{const p=products.find(x=>x.id===id),q=cart[id];tot+=p.price*q;cnt+=q;
    return `<div class="line"><span>${E(p.emoji||'')} ${E(p.name)}</span><span><button class="btn g" data-a="-1" data-id="${id}">−</button> <b>${q}</b> <button class="btn g" data-a="1" data-id="${id}">+</button></span><span>${money(p.price*q)}</span></div>`}).join('');
  $('lines').querySelectorAll('button').forEach(b=>b.onclick=()=>add(b.dataset.id,+b.dataset.a));
  $('info').textContent=`السلة: ${cnt} صنف — ${money(tot)}`;$('cart').classList.toggle('hid',!cnt);
}
$('bar').onclick=()=>$('body').classList.toggle('hid');
$('send').onclick=async()=>{
  const items=Object.keys(cart).map(id=>({id,qty:cart[id]}));if(!items.length)return;
  $('send').disabled=true;
  const {data,error}=await sb.rpc('place_order',{p_name:$('n').value,p_phone:$('p').value,p_address:$('a').value,p_note:$('t').value,p_items:items});
  $('send').disabled=false;
  if(error){alert(error.message);load();return}
  cart={};$('cart').classList.add('hid');$('msg').classList.remove('hid');
  $('msg').textContent='✅ تم استلام طلبك، رقم الطلب: '+data.slice(0,8)+' — هنتواصل معاك قريب.';scrollTo(0,0);load();
};
load();
</script></body></html>
